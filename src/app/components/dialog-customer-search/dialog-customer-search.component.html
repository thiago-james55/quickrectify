<dialog #modal>
    <div class="selfContainer">
        <h1>Procurar Cliente</h1>
        <hr class="defaultHR">
        <div class="search">
            <input class="defaultInput" placeholder="Digite o nome do cliente" type="text">
            <button class="defaultBorder defaultButton">Procurar</button>
        </div>
        <div class="costumerResults">
            <button class="defaultButton defaultBorder" *ngFor="let customer of customers"
                (click)="onCustomerChoose(customer)">{{customer.name}}</button>
        </div>
    </div>
</dialog>
